<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>サクラ日記</title>

    <!-- スマホのホーム画面用設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- アプリ名とアイコンの設定 -->
    <meta name="apple-mobile-web-app-title" content="サクラ日記">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Meiryo', sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0 0 85px 0; 
            background-color: #f6f2e5; 
            color: #263849;
        }

        /* 🎨 ヘッダーエリア */
        .app-header {
            background-color: #d9e5f6;
            padding: 14px 10px 8px 10px;
        }
        h1 { 
            color: #829bb8; 
            font-size: 20px; 
            margin: 0 0 6px 0; 
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .section-title {
            color: #829bb8;
            font-size: 18px;
            font-weight: bold;
            margin: 6px 0 4px 0;
        }
        .subtitle {
            font-size: 11px; 
            color: #263849; 
            margin: 0 0 10px 0;
        }

        .screen {
            display: none; 
            max-width: 600px;
            margin: 0 auto;
            padding: 0 10px;
        }
        .screen.active {
            display: block; 
        }
        
        /* ☁️ 白いカードコンテナ */
        .container {
            background: #fffef8;
            padding: 12px 14px;
            border-radius: 16px;
            margin-bottom: 10px;
            box-shadow: 0 4px 16px rgba(90, 100, 110, 0.10);
            text-align: left;
        }
        .container h3 { 
            margin-top: 0; 
            margin-bottom: 8px; 
            color: #829bb8; 
            font-size: 14px; 
            border-bottom: 1.5px solid #e8edf3; 
            padding-bottom: 6px; 
        }

        /* 🗺️ 日本地図コンテナ（ズーム・パン対応） */
        .map-card {
            background: #fffef8;
            border-radius: 16px;
            padding: 12px 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 16px rgba(90, 100, 110, 0.10);
        }
        .map-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 420px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            background: #faf9f1;
            touch-action: none;
            cursor: grab;
            border: 1px solid #f0ede3;
        }
        .map-container:active {
            cursor: grabbing;
        }

        .map-wrapper {
            position: absolute;
            width: 340px;
            height: auto;
            transform-origin: 0 0;
            will-change: transform;
        }

        .map-image {
            width: 340px;
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* 🟡 小さくすっきりした黄色のピン */
        .map-pin {
            position: absolute;
            width: 16px;
            height: 16px;
            background: rgba(255, 235, 59, 0.85);
            border: 2px solid #f59f00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 0 6px rgba(245, 159, 0, 0.5);
            animation: pulsePin 2s infinite;
        }
        .map-pin:hover, .map-pin:active {
            transform: translate(-50%, -50%) scale(1.4);
            background: rgba(255, 235, 59, 1);
        }
        .map-pin.no-data {
            background: rgba(150, 150, 150, 0.3);
            border: 1.5px solid rgba(120, 120, 120, 0.6);
            width: 11px;
            height: 11px;
            box-shadow: none;
            animation: none;
        }
        .map-pin.no-data:hover, .map-pin.no-data:active {
            background: rgba(255, 235, 59, 0.7);
            border-color: #f59f00;
            width: 16px;
            height: 16px;
        }

        @keyframes pulsePin {
            0% { box-shadow: 0 0 0 0 rgba(245, 159, 0, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(245, 159, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 159, 0, 0); }
        }

        .memory-card {
            background: #fbfaf4;
            border: 1px solid #e9e7de;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .memory-card h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
            border: none;
        }

        /* 📸 横スクロールギャラリー */
        .gallery {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-top: 6px;
            -webkit-overflow-scrolling: touch;
        }
        .gallery img { 
            width: 90px; 
            height: 90px; 
            object-fit: cover; 
            border-radius: 8px; 
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            flex-shrink: 0;
            cursor: pointer;
        }

        /* 💬 ポップアップ通知 */
        #comicToast {
            display: none;
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #ffffff;
            border: 2.5px solid #829bb8;
            border-radius: 20px;
            padding: 14px 24px;
            font-size: 14px;
            font-weight: bold;
            color: #829bb8;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            z-index: 10000;
            pointer-events: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
            opacity: 0;
            text-align: center;
        }
        #comicToast::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 8px 0 8px;
            border-style: solid;
            border-color: #829bb8 transparent;
            display: block;
            width: 0;
        }
        #comicToast.show {
            display: block;
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* 🔍 写真ライトボックス */
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 10px 0 20px 0;
        }
        
        .lightbox-header {
            text-align: right;
            padding: 0 20px;
            min-height: 35px;
        }
        .lightbox-close {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: none;
            font-size: 13px;
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
        }

        .lightbox-main {
            flex: 1;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            align-items: center;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .lightbox-main::-webkit-scrollbar {
            display: none;
        }
        .lightbox-main img {
            flex-shrink: 0;
            width: 100vw;
            max-height: 70vh;
            object-fit: contain;
            scroll-snap-align: center;
        }

        .lightbox-thumbs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 20px;
            justify-content: center;
            -webkit-overflow-scrolling: touch;
        }
        .lightbox-thumbs img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            opacity: 0.5;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .lightbox-thumbs img.active-thumb {
            opacity: 1;
            border-color: #ffffff;
        }

        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .action-btn {
            background-color: #829bb8;
            color: white;
            border: none;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }
        .action-btn:hover { background-color: #6f89a8; }

        .delete-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 8px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }
        .delete-btn:hover { background-color: #fa5252; }

        .form-group {
            margin-bottom: 8px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 3px;
            font-size: 12px;
            color: #829bb8;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 7px 8px;
            box-sizing: border-box;
            border: 1.5px solid #c9d4e1;
            border-radius: 8px;
            font-size: 13px;
            background: #fffef9;
            color: #263849;
        }
        .submit-btn {
            background-color: #829bb8;
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(90, 115, 150, 0.18);
            margin-top: 4px;
        }
        .submit-btn:hover { background-color: #6f89a8; }

        .color-picker-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }
        .color-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-circle.selected {
            border-color: #263849;
            transform: scale(1.1);
        }

        /* 📱 下部ナビゲーションバー */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #d9e5f6;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 -2px 12px rgba(80, 100, 130, 0.06);
            z-index: 1000;
            padding: 8px 0 20px 0;
            border-top: 1px solid #cbd9eb;
        }
        .nav-btn {
            background: none;
            border: none;
            font-size: 10px;
            font-weight: 600;
            color: #6f87a3;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
            border-radius: 12px;
            margin: 0 2px;
            padding: 6px 0;
        }
        .nav-btn svg {
            width: 20px;
            height: 20px;
            stroke: #6f87a3;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-btn.active {
            background-color: #fffef8;
            color: #263849;
            box-shadow: 0 2px 8px rgba(90, 110, 140, 0.08);
        }
        .nav-btn.active svg {
            stroke: #263849;
        }
    </style>
</head>
<body>

    <!-- ヘッダーエリア -->
    <div class="app-header">
        <h1>サクラ日記</h1>
    </div>

    <!-- 💬 ポップアップ通知 -->
    <div id="comicToast">思い出が保存されました！</div>

    <!-- 画面①：日本地図（ホーム） -->
    <div id="screen-map" class="screen active">
        <div class="map-card">
            <div class="section-title">日本地図</div>
            <div class="subtitle">思い出のある県は黄色のピンが光ります！ピンをタップしてね</div>
            
            <div class="map-container" id="mapContainer">
                <div class="map-wrapper" id="mapWrapper">
                    <img src="japan-map.png" alt="日本地図" class="map-image" id="japanMapImg">
                    <!-- 都道府県のピンがJavaScriptでここに動的に配置されます -->
                </div>
            </div>
        </div>
    </div>

    <!-- 画面②：思い出を見る画面 -->
    <div id="screen-view" class="screen">
        <div class="container">
            <h3>都道府県を選択</h3>
            <div class="form-group" style="margin-bottom:0;">
                <label for="viewPrefSelect">見たい都道府県を選ぶ:</label>
                <select id="viewPrefSelect" onchange="onViewPrefChange()"></select>
            </div>
        </div>

        <div class="container" id="memoryArea">
            <h3 id="viewTitle">思い出</h3>
            <p style="color: #666; font-size: 12px;">上のメニューから都道府県を選んでね！</p>
        </div>
    </div>

    <!-- 画面③：思い出を追加する画面 -->
    <div id="screen-add" class="screen">
        <div class="container">
            <h3>新しい思い出を追加する</h3>
            <form id="memoryForm" onsubmit="addMemory(event)">
                <div class="form-group">
                    <label for="addPrefSelect">都道府県:</label>
                    <select id="addPrefSelect"></select>
                </div>
                <div class="form-group">
                    <label for="prefTitle">タイトル（例: 家族旅行の思い出）:</label>
                    <input type="text" id="prefTitle" required placeholder="例: 美味しいものを食べたよ">
                </div>
                <div class="form-group">
                    <label>タイトル文字の色（投稿者識別用）:</label>
                    <div class="color-picker-group">
                        <div class="color-circle selected" style="background-color: #263849;" onclick="selectTitleColor('#263849', this)"></div>
                        <div class="color-circle" style="background-color: #e03131;" onclick="selectTitleColor('#e03131', this)"></div>
                        <div class="color-circle" style="background-color: #2b8a3e;" onclick="selectTitleColor('#2b8a3e', this)"></div>
                        <div class="color-circle" style="background-color: #1971c2;" onclick="selectTitleColor('#1971c2', this)"></div>
                        <div class="color-circle" style="background-color: #d9480f;" onclick="selectTitleColor('#d9480f', this)"></div>
                        <div class="color-circle" style="background-color: #9c36b5;" onclick="selectTitleColor('#9c36b5', this)"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="prefDate">訪問時期:</label>
                    <input type="text" id="prefDate" placeholder="例: 2026年秋">
                </div>
                <div class="form-group">
                    <label for="prefComment">ひとことメモ:</label>
                    <textarea id="prefComment" rows="2" placeholder="感想などを入力"></textarea>
                </div>
                <div class="form-group">
                    <label for="prefPhotos">写真を一気に何枚でも選択:</label>
                    <input type="file" id="prefPhotos" accept="image/*" multiple required>
                </div>
                <button type="submit" class="submit-btn">思い出を保存する</button>
            </form>
        </div>
    </div>

    <!-- 画面④：思い出一覧画面 -->
    <div id="screen-all" class="screen">
        <div class="container">
            <h3>すべての思い出</h3>
            <div class="form-group" style="margin-bottom:0;">
                <label for="sortSelect">並び替え:</label>
                <select id="sortSelect" onchange="renderAllMemories()">
                    <option value="newest">新しい順</option>
                    <option value="count">写真枚数順</option>
                    <option value="north">北から順 (都道府県順)</option>
                </select>
            </div>
        </div>
        <div id="allMemoryArea"></div>
    </div>

    <!-- 🔍 写真ライトボックス -->
    <div id="lightbox">
        <div class="lightbox-header">
            <button class="lightbox-close" onclick="closeLightbox()">✕ 閉じる</button>
        </div>
        <div class="lightbox-main" id="lightbox-main" onscroll="onLightboxScroll()"></div>
        <div class="lightbox-thumbs" id="lightbox-thumbs"></div>
    </div>

    <!-- 📱 下部ナビゲーションバー -->
    <div class="nav-bar">
        <button class="nav-btn active" id="nav-map" onclick="switchScreen('map')">
            <svg viewBox="0 0 24 24"><path d="M9 18l-6-.5V6l6 .5M9 18l6-1.5m-6 1.5v-12l6 1.5m0 10.5l6-.5V5l-6 .5m0 12v-12"/></svg>
            日本地図
        </button>
        <button class="nav-btn" id="nav-view" onclick="switchScreen('view')">
            <svg viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            思い出を見る
        </button>
        <button class="nav-btn" id="nav-add" onclick="switchScreen('add')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
            追加する
        </button>
        <button class="nav-btn" id="nav-all" onclick="switchScreen('all')">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            一覧・共有
        </button>
    </div>

    <script>
        const prefOrder = [
            "hokkaido", "aomori", "iwate", "akita", "yamagata", "miyagi", "fukushima",
            "ibaraki", "tochigi", "gunma", "saitama", "chiba", "tokyo", "kanagawa",
            "niigata", "toyama", "ishikawa", "fukui", "yamanashi", "nagano", "gifu", "shizuoka", "aichi",
            "mie", "shiga", "kyoto", "osaka", "hyogo", "nara", "wakayama",
            "tottori", "shimane", "okayama", "hiroshima", "yamaguchi",
            "tokushima", "kagawa", "ehime", "kochi",
            "fukuoka", "saga", "nagasaki", "kumamoto", "oita", "miyazaki", "kagoshima", "okinawa"
        ];

        const prefNames = {
            hokkaido: "北海道", aomori: "青森県", iwate: "岩手県", akita: "秋田県", yamagata: "山形県", miyagi: "宮城県", fukushima: "福島県",
            ibaraki: "茨城県", tochigi: "栃木県", gunma: "群馬県", saitama: "埼玉県", chiba: "千葉県", tokyo: "東京都", kanagawa: "神奈川県",
            niigata: "新潟県", toyama: "富山県", ishikawa: "石川県", fukui: "福井県", yamanashi: "山梨県", nagano: "長野県", gifu: "岐阜県", shizuoka: "静岡県", aichi: "愛知県",
            mie: "三重県", shiga: "滋賀県", kyoto: "京都府", osaka: "大阪府", hyogo: "兵庫県", nara: "奈良県", wakayama: "和歌山県",
            tottori: "鳥取県", shimane: "島根県", okayama: "岡山県", hiroshima: "広島県", yamaguchi: "山口県",
            tokushima: "徳島県", kagawa: "香川県", ehime: "愛媛県", kochi: "高知県",
            fukuoka: "福岡県", saga: "佐賀県", nagasaki: "長崎県", kumamoto: "熊本県", oita: "大分県", miyazaki: "宮崎県", kagoshima: "鹿児島県", okinawa: "沖縄県"
        };

        // 🎯 各都道府県のピン位置座標を完全微調整 (0%〜100%)
        const prefCoords = {
            hokkaido: { x: 74, y: 17 }, aomori: { x: 67, y: 31 }, iwate: { x: 72, y: 37 }, akita: { x: 63, y: 39 },
            yamagata: { x: 64, y: 46 }, miyagi: { x: 70, y: 46 }, fukushima: { x: 66, y: 52 },
            ibaraki: { x: 70, y: 58 }, tochigi: { x: 66, y: 57 }, gunma: { x: 62, y: 57 }, saitama: { x: 64, y: 60 },
            chiba: { x: 69, y: 61 }, tokyo: { x: 65, y: 61 }, kanagawa: { x: 65, y: 64 },
            niigata: { x: 59, y: 48 }, toyama: { x: 53, y: 52 }, ishikawa: { x: 50, y: 49 }, fukui: { x: 51, y: 55 },
            yamanashi: { x: 60, y: 61 }, nagano: { x: 57, y: 56 }, gifu: { x: 55, y: 56 }, shizuoka: { x: 62, y: 64 }, aichi: { x: 56, y: 63 },
            mie: { x: 54, y: 66 }, shiga: { x: 51, y: 58 }, kyoto: { x: 49, y: 58 }, osaka: { x: 48, y: 62 },
            hyogo: { x: 45, y: 58 }, nara: { x: 51, y: 63 }, wakayama: { x: 49, y: 67 },
            tottori: { x: 40, y: 58 }, shimane: { x: 35, y: 58 }, okayama: { x: 41, y: 62 }, hiroshima: { x: 37, y: 63 }, yamaguchi: { x: 32, y: 65 },
            tokushima: { x: 43, y: 68 }, kagawa: { x: 41, y: 66 }, ehime: { x: 38, y: 69 }, kochi: { x: 40, y: 73 },
            fukuoka: { x: 28, y: 68 }, saga: { x: 25, y: 69 }, nagasaki: { x: 22, y: 71 }, kumamoto: { x: 26, y: 73 },
            oita: { x: 30, y: 70 }, miyazaki: { x: 30, y: 77 }, kagoshima: { x: 26, y: 81 }, okinawa: { x: 19, y: 88 }
        };

        let memories = {};
        let db = null;
        let selectedTitleColor = '#263849';

        function selectTitleColor(color, element) {
            selectedTitleColor = color;
            document.querySelectorAll('.color-circle').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("SakuraDiaryDB", 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains("memories")) {
                        database.createObjectStore("memories");
                    }
                };
            });
        }

        function loadMemoriesFromDB() {
            return new Promise((resolve) => {
                if (!db) {
                    resolve({});
                    return;
                }
                const transaction = db.transaction(["memories"], "readonly");
                const store = transaction.objectStore("memories");
                const request = store.get("all_data");
                request.onsuccess = () => {
                    memories = request.result || {};
                    resolve(memories);
                };
                request.onerror = () => resolve({});
            });
        }

        function saveMemoriesToDB() {
            return new Promise((resolve) => {
                if (!db) {
                    resolve();
                    return;
                }
                const transaction = db.transaction(["memories"], "readwrite");
                const store = transaction.objectStore("memories");
                const request = store.put(memories, "all_data");
                request.onsuccess = () => resolve();
                request.onerror = () => resolve();
            });
        }

        async function checkSharedUrlData() {
            const params = new URLSearchParams(window.location.search);
            const sharedData = params.get('share');
            if (sharedData) {
                try {
                    const decoded = JSON.parse(atob(sharedData));
                    if (decoded && decoded.prefKey && decoded.item) {
                        if (!memories[decoded.prefKey]) {
                            memories[decoded.prefKey] = [];
                        }
                        if (!memories[decoded.prefKey].some(m => m.id === decoded.item.id)) {
                            memories[decoded.prefKey].push(decoded.item);
                            await saveMemoriesToDB();
                            alert(`${prefNames[decoded.prefKey]}の共有された思い出を追加しました！`);
                        }
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                } catch (e) {
                    console.error("共有データの読み込みに失敗しました", e);
                }
            }
        }

        let currentPhotosArray = [];

        function showComicToast() {
            const toast = document.getElementById('comicToast');
            if (!toast) return;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1000);
        }

        // 🔍 地図のズーム・パン（移動）機能
        let scale = 1;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        let panning = false;
        let lastTouchDistance = 0;

        const mapContainer = document.getElementById('mapContainer');
        const mapWrapper = document.getElementById('mapWrapper');

        function applyTransform() {
            if (scale < 1) scale = 1;
            if (scale > 3.5) scale = 3.5;

            const containerW = mapContainer.clientWidth;
            const containerH = mapContainer.clientHeight;
            const mapW = 340 * scale;
            const mapH = 400 * scale;

            const minX = containerW - mapW;
            const minY = containerH - mapH;

            if (mapW <= containerW) {
                pointX = (containerW - mapW) / 2;
            } else {
                if (pointX > 0) pointX = 0;
                if (pointX < minX) pointX = minX;
            }

            if (mapH <= containerH) {
                pointY = (containerH - mapH) / 2;
            } else {
                if (pointY > 0) pointY = 0;
                if (pointY < minY) pointY = minY;
            }

            mapWrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        mapContainer.addEventListener('mousedown', (e) => {
            e.preventDefault();
            panning = true;
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!panning) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            applyTransform();
        });

        window.addEventListener('mouseup', () => {
            panning = false;
        });

        mapContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                panning = true;
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
            } else if (e.touches.length === 2) {
                panning = false;
                lastTouchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: false });

        mapContainer.addEventListener('touchmove', (e) => {
            if (panning && e.touches.length === 1) {
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
                applyTransform();
            } else if (e.touches.length === 2) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (lastTouchDistance > 0) {
                    const zoomFactor = currentDistance / lastTouchDistance;
                    const newScale = scale * zoomFactor;
                    if (newScale >= 1 && newScale <= 3.5) {
                        scale = newScale;
                    }
                }
                lastTouchDistance = currentDistance;
                applyTransform();
            }
            e.preventDefault();
        }, { passive: false });

        mapContainer.addEventListener('touchend', () => {
            lastTouchDistance = 0;
            panning = false;
        });

        function switchScreen(screenName) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            const targetScreen = document.getElementById('screen-' + screenName);
            const targetNav = document.getElementById('nav-' + screenName);

            if (targetScreen) targetScreen.classList.add('active');
            if (targetNav) targetNav.classList.add('active');

            window.scrollTo(0, 0);

            if (screenName === 'view') {
                const currentPref = document.getElementById('viewPrefSelect').value;
                if (currentPref) showMemory(currentPref);
            } else if (screenName === 'all') {
                renderAllMemories();
            }
        }

        function goToMemory(prefKey) {
            switchScreen('view');
            const viewSelect = document.getElementById('viewPrefSelect');
            if (viewSelect) {
                viewSelect.value = prefKey;
                showMemory(prefKey);
            }
        }

        function renderMapPins() {
            const wrapper = document.getElementById('mapWrapper');
            if (!wrapper) return;

            const existingPins = wrapper.querySelectorAll('.map-pin');
            existingPins.forEach(p => p.remove());

            for (let key in prefCoords) {
                const coord = prefCoords[key];
                const hasData = memories[key] && memories[key].length > 0;

                const pin = document.createElement('div');
                pin.className = `map-pin ${hasData ? '' : 'no-data'}`;
                pin.style.left = `${coord.x}%`;
                pin.style.top = `${coord.y}%`;
                pin.title = prefNames[key] + (hasData ? ' (思い出あり)' : '');
                
                pin.addEventListener('click', (e) => {
                    e.stopPropagation();
                    goToMemory(key);
                });
                pin.addEventListener('touchend', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    goToMemory(key);
                });

                wrapper.appendChild(pin);
            }
        }

        function initApp() {
            const viewSelect = document.getElementById('viewPrefSelect');
            const addSelect = document.getElementById('addPrefSelect');
            
            if (!viewSelect || !addSelect) return;

            const currentViewPref = viewSelect.value;
            viewSelect.innerHTML = '';
            addSelect.innerHTML = '';

            for (let key in prefNames) {
                viewSelect.innerHTML += `<option value="${key}">${prefNames[key]}</option>`;
                addSelect.innerHTML += `<option value="${key}">${prefNames[key]}</option>`;
            }

            if (currentViewPref) viewSelect.value = currentViewPref;
            if (viewSelect.value) showMemory(viewSelect.value);

            renderMapPins();
            applyTransform();
        }

        function onViewPrefChange() {
            const prefKey = document.getElementById('viewPrefSelect').value;
            showMemory(prefKey);
        }

        function generateMemoryCardHtml(item, prefKey) {
            let photoTags = '';
            if (item.photos && item.photos.length > 0) {
                const photosJson = JSON.stringify(item.photos).replace(/"/g, '&quot;');
                item.photos.forEach((photoSrc, index) => {
                    photoTags += `<img src="${photoSrc}" alt="思い出の写真" onclick="openLightbox(${photosJson}, ${index})">`;
                });
            } else {
                photoTags = '<p style="color:#888; font-size:12px;">写真なし</p>';
            }

            const titleColor = item.titleColor || '#829bb8';

            return `
                <div class="memory-card" id="card-${item.id}">
                    <h3 style="color: ${titleColor};">${item.title} (${prefNames[prefKey]})</h3>
                    <p style="font-size:11px; margin: 2px 0;"><strong>訪問時期:</strong> <span id="date-val-${item.id}">${item.date || '未設定'}</span></p>
                    <p style="font-size:11px; margin: 2px 0;"><strong>ひとことメモ:</strong> <span id="comment-val-${item.id}">${item.comment || 'なし'}</span></p>
                    <div class="gallery">${photoTags}</div>
                    <div class="btn-row">
                        <button class="action-btn" onclick="shareMemory('${prefKey}', ${item.id})">共有URL発行</button>
                        <button class="action-btn" onclick="startEditMemory('${prefKey}', ${item.id})">編集</button>
                        <button class="delete-btn" onclick="deleteSingleMemory('${prefKey}', ${item.id})">削除</button>
                    </div>
                </div>
            `;
        }

        function showMemory(prefKey) {
            const list = memories[prefKey] || [];
            const area = document.getElementById('memoryArea');
            const prefName = prefNames[prefKey] || "その地域";

            if (!area) return;

            if (list.length === 0) {
                area.innerHTML = `
                    <h3>${prefName}の思い出</h3>
                    <p style="color:#888; font-size:12px;">この地域の思い出はまだ登録されていません。</p>
                    <button class="submit-btn" style="margin-top:6px; background:#829bb8; font-size:12px; padding:8px;" onclick="openAddForPref('${prefKey}')">この地域の思い出を追加する</button>
                `;
                return;
            }

            let cardsHtml = '';
            list.forEach((item) => {
                cardsHtml += generateMemoryCardHtml(item, prefKey);
            });

            area.innerHTML = `
                <h3>${prefName}の思い出（全 ${list.length} 件）</h3>
                ${cardsHtml}
                <button class="submit-btn" style="margin-top:6px; background:#829bb8; font-size:12px; padding:8px;" onclick="openAddForPref('${prefKey}')">さらに追加する</button>
            `;
        }

        function renderAllMemories() {
            const sortType = document.getElementById('sortSelect').value;
            const area = document.getElementById('allMemoryArea');
            if (!area) return;

            let allItems = [];
            for (let pKey in memories) {
                if (memories[pKey] && Array.isArray(memories[pKey])) {
                    memories[pKey].forEach(item => {
                        allItems.push({ ...item, prefKey: pKey });
                    });
                }
            }

            if (allItems.length === 0) {
                area.innerHTML = `<div class="container"><p style="color:#666; font-size:12px; text-align:center;">登録されている思い出はまだありません。</p></div>`;
                return;
            }

            if (sortType === 'newest') {
                allItems.sort((a, b) => b.id - a.id);
            } else if (sortType === 'count') {
                allItems.sort((a, b) => (b.photos ? b.photos.length : 0) - (a.photos ? a.photos.length : 0));
            } else if (sortType === 'north') {
                allItems.sort((a, b) => prefOrder.indexOf(a.prefKey) - prefOrder.indexOf(b.prefKey));
            }

            let html = '';
            allItems.forEach(item => {
                html += `<div class="container">${generateMemoryCardHtml(item, item.prefKey)}</div>`;
            });
            area.innerHTML = html;
        }

        function startEditMemory(prefKey, itemId) {
            const item = memories[prefKey].find(m => m.id === itemId);
            if (!item) return;

            const card = document.getElementById(`card-${itemId}`);
            if (!card) return;

            card.innerHTML = `
                <h3>思い出の編集</h3>
                <div class="form-group">
                    <label>訪問時期:</label>
                    <input type="text" id="edit-date-${itemId}" value="${item.date || ''}">
                </div>
                <div class="form-group">
                    <label>ひとことメモ:</label>
                    <textarea id="edit-comment-${itemId}" rows="2">${item.comment || ''}</textarea>
                </div>
                <div class="btn-row">
                    <button class="action-btn" style="background-color: #2b8a3e;" onclick="saveEditMemory('${prefKey}', ${itemId})">保存</button>
                    <button class="delete-btn" onclick="showMemory('${prefKey}'); if(document.getElementById('screen-all').classList.contains('active')) renderAllMemories();">キャンセル</button>
                </div>
            `;
        }

        async function saveEditMemory(prefKey, itemId) {
            const item = memories[prefKey].find(m => m.id === itemId);
            if (!item) return;

            const newDate = document.getElementById(`edit-date-${itemId}`).value;
            const newComment = document.getElementById(`edit-comment-${itemId}`).value;

            item.date = newDate;
            item.comment = newComment;

            await saveMemoriesToDB();
            showComicToast();

            if (document.getElementById('screen-all').classList.contains('active')) {
                renderAllMemories();
            } else {
                showMemory(prefKey);
            }
        }

        function shareMemory(prefKey, itemId) {
            const item = memories[prefKey].find(m => m.id === itemId);
            if (!item) return;

            const sharePayload = { prefKey: prefKey, item: item };
            const jsonStr = JSON.stringify(sharePayload);
            const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
            const shareUrl = `${window.location.origin}${window.location.pathname}?share=${encoded}`;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('共有URLをコピーしました！このURLを同じアプリを持つ友だちに送ると、一斉にアルバムに追加できます。');
                }).catch(() => {
                    prompt('以下のURLをコピーしてください:', shareUrl);
                });
            } else {
                prompt('以下のURLをコピーしてください:', shareUrl);
            }
        }

        function openLightbox(photosArray, startIndex) {
            currentPhotosArray = photosArray;
            const lightbox = document.getElementById('lightbox');
            const mainContainer = document.getElementById('lightbox-main');
            const thumbsContainer = document.getElementById('lightbox-thumbs');
            
            mainContainer.innerHTML = '';
            thumbsContainer.innerHTML = '';

            photosArray.forEach((src, idx) => {
                mainContainer.innerHTML += `<img src="${src}" alt="拡大写真">`;
                thumbsContainer.innerHTML += `<img src="${src}" alt="サムネイル" id="thumb-${idx}" onclick="scrollToImage(${idx})">`;
            });

            lightbox.style.display = 'flex';
            setTimeout(() => { scrollToImage(startIndex, false); }, 50);
        }

        function scrollToImage(index, smooth = true) {
            const mainContainer = document.getElementById('lightbox-main');
            const imgs = mainContainer.getElementsByTagName('img');
            if (imgs[index]) {
                imgs[index].scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', inline: 'center', block: 'nearest' });
            }
            updateActiveThumb(index);
        }

        function onLightboxScroll() {
            const mainContainer = document.getElementById('lightbox-main');
            const imgs = mainContainer.getElementsByTagName('img');
            let closestIndex = 0;
            let minDistance = Infinity;

            for (let i = 0; i < imgs.length; i++) {
                const distance = Math.abs(imgs[i].getBoundingClientRect().left - mainContainer.clientWidth / 2);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = i;
                }
            }
            updateActiveThumb(closestIndex);
        }

        function updateActiveThumb(index) {
            const thumbs = document.getElementById('lightbox-thumbs').getElementsByTagName('img');
            for (let i = 0; i < thumbs.length; i++) {
                if (i === index) {
                    thumbs[i].classList.add('active-thumb');
                    thumbs[i].scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
                } else {
                    thumbs[i].classList.remove('active-thumb');
                }
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function openAddForPref(prefKey) {
            switchScreen('add');
            const addSelect = document.getElementById('addPrefSelect');
            const titleInput = document.getElementById('prefTitle');
            if (addSelect) addSelect.value = prefKey;
            contentTitle = (prefNames[prefKey] || '') + 'の思い出';
            if (titleInput) titleInput.value = contentTitle;
        }

        async function addMemory(event) {
            event.preventDefault();

            const selectBox = document.getElementById('addPrefSelect');
            const titleInput = document.getElementById('prefTitle');
            const dateInput = document.getElementById('prefDate');
            const commentInput = document.getElementById('prefComment');
            const fileInput = document.getElementById('prefPhotos');

            if (!selectBox || !titleInput || !fileInput) return;

            const id = selectBox.value;
            const title = titleInput.value;
            const date = dateInput ? dateInput.value : '';
            const comment = commentInput ? commentInput.value : '';

            if (!memories[id]) {
                memories[id] = [];
            }

            const newMemory = {
                id: Date.now(),
                title: title,
                titleColor: selectedTitleColor,
                date: date,
                comment: comment,
                photos: []
            };

            const files = fileInput.files;

            async function finalizeSave() {
                memories[id].push(newMemory);
                await saveMemoriesToDB();
                initApp();

                showComicToast();

                const form = document.getElementById('memoryForm');
                if (form) form.reset();

                setTimeout(() => {
                    switchScreen('view');
                    const viewSelect = document.getElementById('viewPrefSelect');
                    if (viewSelect) viewSelect.value = id;
                    showMemory(id);
                }, 900);
            }

            if (files && files.length > 0) {
                let processedFiles = 0;
                for (let i = 0; i < files.length; i++) {
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        newMemory.photos.push(e.target.result);
                        processedFiles++;
                        if (processedFiles === files.length) {
                            await finalizeSave();
                        }
                    };
                    reader.readAsDataURL(files[i]);
                }
            } else {
                await finalizeSave();
            }
        }

        async function deleteSingleMemory(prefKey, memoryId) {
            if (confirm(`この思い出を削除しますか？`)) {
                memories[prefKey] = memories[prefKey].filter(item => item.id !== memoryId);
                await saveMemoriesToDB();
                initApp();
                if (document.getElementById('screen-all').classList.contains('active')) {
                    renderAllMemories();
                } else {
                    showMemory(prefKey);
                }
                alert('思い出を削除しました。');
            }
        }

        window.onload = async function() {
            try {
                await initDB();
                await loadMemoriesFromDB();
                await checkSharedUrlData();
            } catch (e) {
                console.error(e);
            }
            initApp();
        };
    </script>
